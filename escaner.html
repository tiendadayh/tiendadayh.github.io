<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Escáner DAYH</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#111827;--card:#1f2937;--text:#f9fafb;--muted:#9ca3af;--primary:#a855f7;--ok:#10b981;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
h1{font-size:18px;margin:0}
#estado{font-size:13px;color:var(--muted)}
#estado::before{content:"●";margin-right:6px;color:var(--bad)}
#estado.on::before{color:var(--ok)}
#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:120px}
#apagada{display:none;text-align:center;padding:34px 16px;border-radius:14px;background:var(--card);border:2px dashed #4b5563;color:var(--muted);font-size:15px;cursor:pointer}
#apagada .ico{font-size:42px;display:block;margin-bottom:6px}
#apagada b{color:var(--text)}
#btnCam.on{background:var(--bad)}
#btnCam.off{background:var(--ok)}
#btnCam:disabled{opacity:.5}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:600;color:#fff;background:var(--primary);margin-top:12px}
#res{margin-top:14px;padding:14px;border-radius:12px;background:var(--card);text-align:center;font-size:15px}
#res b{display:block;font-size:22px;margin-top:4px;word-break:break-all}
#res.ok{border:2px solid var(--ok)}#res.bad{border:2px solid var(--bad)}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #374151;background:var(--card);color:var(--text);font-size:16px}
form button{width:auto;margin:0;padding:12px 18px}
p.n{color:var(--muted);font-size:13px;text-align:center}
#quien{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--muted)}
#quien b{color:var(--text)}
button.link{width:auto;margin:0;padding:6px 12px;font-size:13px;background:#374151;border-radius:8px}
</style>
</head>
<body>
<header><h1>📱 Escáner DAYH</h1><span id="estado">Conectando…</span></header>

<div id="quien"><span>Este celular: <b id="nombre"></b></span><button class="link" id="btnNombre">✏️ Cambiar nombre</button></div>
<div id="reader"></div>
<div id="apagada"><span class="ico">📷</span><b>Cámara apagada</b><br><span id="motivoApagada">Toca aquí o el botón verde para escanear de nuevo.</span></div>
<button id="btnCam" class="off">📷 Escanear</button>
<p class="n" id="notaAuto" style="display:none;margin:8px 0 0"></p>
<div id="res" hidden></div>

<form id="manual">
  <input id="txt" placeholder="¿No lee? Escribe el código" autocomplete="off" enterkeyhint="send">
  <button>Enviar</button>
</form>
<p class="n">Cada código escaneado se agrega al carrito del punto de venta.</p>

<script>
const CFG = {
  apiKey: "AIzaSyBHrUnR49F-dY_kgyiw88SepoZ8-lSjxbM",
  authDomain: "tiendadayh.firebaseapp.com",
  databaseURL: "https://tiendadayh-default-rtdb.firebaseio.com",
  projectId: "tiendadayh",
  appId: "1:821695977091:web:3d7be4af127370ef9dadb6"
};
firebase.initializeApp(CFG);
const db = firebase.database();

// El token llega en el enlace del QR del POS y se recuerda en el celular
let token = new URLSearchParams(location.search).get("t");
try { token ? localStorage.setItem("escaner_t", token) : (token = localStorage.getItem("escaner_t")); } catch (e) {}

const $ = id => document.getElementById(id);
const res = $("res");
function mostrar(titulo, codigo, ok) {
  res.hidden = false;
  res.className = ok ? "ok" : "bad";
  res.innerHTML = titulo + "<b></b>";
  res.querySelector("b").textContent = codigo;
}

if (!token) {
  mostrar("✖ Falta el enlace del POS", "Abre esta página desde el QR de “ESCÁNER CELULAR”", false);
  $("btnCam").disabled = true;
}

// ---- Presencia: el POS ve qué celulares están conectados y pueden escanear ----
function idDispositivo() {
  try {
    let d = localStorage.getItem("escaner_dev");
    if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem("escaner_dev", d); }
    return d;
  } catch (e) { return Math.random().toString(36).slice(2, 10); }
}
function nombreInicial() {
  try { const n = localStorage.getItem("escaner_nombre"); if (n) return n; } catch (e) {}
  const ua = navigator.userAgent;
  const base = /iPhone|iPad/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : "Celular";
  const n = base + " " + (Math.floor(Math.random() * 90) + 10);
  try { localStorage.setItem("escaner_nombre", n); } catch (e) {}
  return n;
}
const devId = idDispositivo();
let nombre = nombreInicial();
let escaneos = 0, camaraOn = false, presRef = null;
let permiso = null;       // null = verificando; {permitido, motivo}: lo decide el punto de venta
let ctrlRef = null, avisoBloqueo = false;
const permitido = () => !!(permiso && permiso.permitido === true);
$("nombre").textContent = nombre;

function actualizarPresencia(extra) {
  if (!presRef) return;
  presRef.update(Object.assign({ nombre: nombre, camara: camaraOn, escaneos: escaneos }, extra || {})).catch(() => {});
}

db.ref(".info/connected").on("value", s => {
  const e = $("estado");
  e.textContent = s.val() ? "Conectado" : "Sin conexión";
  e.className = s.val() ? "on" : "";
  if (s.val() && token) {
    presRef = db.ref("escaner_presencia/" + token + "/" + devId);
    // Si se cierra la página o se pierde la señal, Firebase lo borra solo
    presRef.onDisconnect().remove().then(() =>
      presRef.set({ nombre: nombre, ts: firebase.database.ServerValue.TIMESTAMP, camara: camaraOn, escaneos: escaneos })
    ).catch(() => {});
  }
});

$("btnNombre").onclick = () => {
  const n = (prompt("Nombre para este celular (lo verás en el punto de venta):", nombre) || "").trim().slice(0, 30);
  if (!n) return;
  nombre = n; $("nombre").textContent = n;
  try { localStorage.setItem("escaner_nombre", n); } catch (e) {}
  actualizarPresencia();
};

function enviar(codigo) {
  codigo = String(codigo || "").trim();
  if (!codigo || !token) return;
  if (!permitido()) {
    mostrar((permiso && permiso.motivo) || "Esperando permiso del punto de venta…", "🔒 No se envió", false);
    return;
  }
  db.ref("escaner/" + token)
    .push({ codigo: codigo, dev: devId, ts: firebase.database.ServerValue.TIMESTAMP })
    .then(() => {
      mostrar("✔ Enviado al POS", codigo, true);
      escaneos++;
      actualizarPresencia({ ultimo: firebase.database.ServerValue.TIMESTAMP });
    })
    .catch(err => mostrar("✖ No se pudo enviar", err.message, false));
}

let audio;
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 1300; g.gain.value = 0.15;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.1);
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(80);
}

// Evita enviar el mismo código muchas veces seguidas mientras sigue frente a la cámara
let ultimo = "", tUltimo = 0;
function alEscanear(texto) {
  const ahora = Date.now();
  ultimaActividad = ahora;                 // mantiene la cámara encendida (apagado automático)
  if (texto === ultimo && ahora - tUltimo < 2500) return;
  ultimo = texto; tUltimo = ahora;
  beep();
  enviar(texto);
}

// Apagado automático: si pasan estos segundos sin leer ningún código, la cámara se
// apaga sola (ahorra batería). Cámbialo aquí si quieres más o menos tiempo.
const AUTO_APAGADO_SEG = 60;
let ultimaActividad = Date.now(), intervaloAuto = null;

function detenerAutoApagado() {
  if (intervaloAuto) { clearInterval(intervaloAuto); intervaloAuto = null; }
  $("notaAuto").style.display = "none";
}
function iniciarAutoApagado() {
  detenerAutoApagado();
  ultimaActividad = Date.now();
  const nota = $("notaAuto");
  nota.style.display = "block";
  const revisar = () => {
    const restante = Math.ceil(AUTO_APAGADO_SEG - (Date.now() - ultimaActividad) / 1000);
    if (restante <= 0) {
      apagarCamara("Se apagó sola tras " + AUTO_APAGADO_SEG + " s sin escanear. Toca para escanear de nuevo.");
    } else if (restante <= 10) {
      nota.textContent = "⏱ Se apagará en " + restante + " s — escanea algo para mantenerla";
    } else {
      nota.textContent = "⏱ Se apaga sola tras " + AUTO_APAGADO_SEG + " s sin escanear";
    }
  };
  revisar();
  intervaloAuto = setInterval(revisar, 1000);
}

let scanner = null, ocupado = false;

// El botón se bloquea si el punto de venta no permite escanear (salvo para poder quitar la cámara)
function refrescarBoton() {
  $("btnCam").disabled = !token || ocupado || (!scanner && !permitido());
}

// Muestra u oculta la cámara y deja el botón en el estado correcto
function pintarCamara(encendida, motivo) {
  const btn = $("btnCam");
  $("reader").style.display = encendida ? "block" : "none";
  $("apagada").style.display = encendida ? "none" : "block";
  btn.textContent = encendida ? "✖ Quitar cámara" : "📷 Escanear";
  btn.className = encendida ? "on" : "off";
  if (!encendida) $("motivoApagada").textContent = motivo ||
    (permitido() ? "Toca aquí o el botón verde para escanear de nuevo." : "Esperando permiso del punto de venta…");
  camaraOn = encendida;
  refrescarBoton();
  actualizarPresencia();
}

async function encenderCamara() {
  if (scanner || ocupado || !token) return;
  if (!permitido()) {
    mostrar((permiso && permiso.motivo) || "Esperando permiso del punto de venta…", "🔒 No disponible", false);
    return;
  }
  ocupado = true; $("btnCam").disabled = true;
  try {
    $("apagada").style.display = "none";
    $("reader").style.display = "block";   // debe estar visible antes de arrancar
    const F = Html5QrcodeSupportedFormats;
    const s = new Html5Qrcode("reader", {
      formatsToSupport: [F.CODE_128, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_39, F.ITF, F.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    await s.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h * 0.6, 170)) }) },
      alEscanear, () => {}
    );
    scanner = s;
    ultimo = ""; tUltimo = 0;               // el primer código al volver a escanear siempre se envía
    pintarCamara(true);
    iniciarAutoApagado();
  } catch (err) {
    scanner = null;
    pintarCamara(false, "No se pudo abrir la cámara. Revisa el permiso del navegador y toca para reintentar.");
    mostrar("✖ No se pudo abrir la cámara", "Revisa el permiso de cámara del navegador", false);
  } finally {
    ocupado = false; refrescarBoton();
  }
}

async function apagarCamara(motivo) {
  if (!scanner || ocupado) return;
  ocupado = true;
  const s = scanner; scanner = null;
  detenerAutoApagado();
  try { await s.stop(); } catch (e) {}
  try { s.clear(); } catch (e) {}           // libera el video para poder volver a encender
  ocupado = false;
  pintarCamara(false, motivo);
}

$("btnCam").onclick = () => scanner ? apagarCamara() : encenderCamara();
$("apagada").onclick = () => encenderCamara();

// Si el celular se bloquea o cambias de app, el sistema congela la cámara: se apaga
// limpia y avisa; al regresar solo tocas "Escanear" y vuelve a funcionar.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && scanner) apagarCamara("Se apagó al salir de la página. Toca para escanear de nuevo.");
});

// ---- Permiso: el punto de venta decide si este celular puede escanear (interruptor
// o bloqueo). Si no, la cámara se apaga sola y se muestra el motivo.
function aplicarPermiso(p) {
  permiso = (p && typeof p === "object") ? p : null;
  if (permiso && permiso.permitido !== true) {
    const m = permiso.motivo || "Este celular no tiene permiso para escanear.";
    if (scanner) apagarCamara(m); else pintarCamara(false, m);
    mostrar(m, "🔒 Escáner no disponible", false);
    avisoBloqueo = true;
  } else if (permiso) {
    if (avisoBloqueo) { res.hidden = true; avisoBloqueo = false; }
    if (!scanner) pintarCamara(false);
  }
  refrescarBoton();
}
function escucharControl() {
  if (!token || ctrlRef) return;
  ctrlRef = db.ref("escaner_control/" + token + "/dispositivos/" + devId);
  ctrlRef.on("value", s => aplicarPermiso(s.val()),
    () => aplicarPermiso({ permitido: false, motivo: "No se pudo verificar el permiso con el punto de venta." }));
}

pintarCamara(false);
escucharControl();

$("manual").onsubmit = e => { e.preventDefault(); enviar($("txt").value); $("txt").value = ""; };
</script>
</body>
</html>
